name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the running job pointless: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Runners ship no debug keystore, and AGP does not always create one:
      # assembleDebug then dies in validateSigningDebug. This is the documented
      # default debug identity, so the APK is identical to a local debug build.
      - name: Ensure a debug keystore exists
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "C=US, O=Android, CN=Android Debug"
          fi

      # The updater's repo constant is the one thing a copy-pasted app gets
      # wrong silently: it would check another app's releases and report "up to
      # date" forever, or hand the user the wrong APK.
      - name: Updater must point at this repo
        run: |
          file=$(find app/src/main -name GithubReleases.kt | head -1)
          if [ -z "$file" ]; then echo "no updater in this app, skipping"; exit 0; fi
          declared=$(grep -oE '"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"' "$file" | head -1 | tr -d '"')
          if [ "$declared" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::updater points at '$declared' but this repo is '$GITHUB_REPOSITORY'"
            exit 1
          fi
          echo "updater points at $declared"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: duolock-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 7
